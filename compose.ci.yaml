# `pnpm ci:local` (scripts/ci-local.ts): the CI jobs that need no Docker of their own, each in a fresh `runner`
# container (`docker compose run --rm runner pnpm ci:<job>`) next to Postgres and Mailpit, with the limits of a
# GitHub-hosted runner. The runner is the official Playwright image for @playwright/test, so all five browser
# projects run, WebKit included; pnpm then installs the Node of package.json#devEngines.runtime like everywhere else.
# The checkout lives in the `work` volume, which the script fills once per run; `down -v` removes it.
# Image pins are checked against scripts/images.ts by `pnpm ci:workflows`; Renovate moves the quoted build args with
# scripts/images.ts (its regex manager in renovate.json covers this file).
services:
  db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    # The same database and credentials as CI's `postgres` service; the data lives in memory.
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-ci
      POSTGRES_DB: app
    tmpfs:
      - /var/lib/postgresql:size=512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U app -d app]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  # The integration and E2E servers send account mail here, and the E2E tests read it back (CI's `mailpit`).
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    mem_limit: 128m

  runner:
    build:
      # The pinned Caddy binary serves the edge for `lighthouse` (EDGE_RUNTIME=binary: no Docker in here).
      dockerfile_inline: |
        ARG PLAYWRIGHT_IMAGE
        ARG CADDY_IMAGE
        FROM $${CADDY_IMAGE} AS caddy
        FROM $${PLAYWRIGHT_IMAGE}
        ARG PNPM_VERSION
        RUN npm install --global --no-fund --no-audit "pnpm@$${PNPM_VERSION}" && npm cache clean --force
        # git refuses a repository whose owner differs from the process's ("dubious ownership"), and the
        # host's checkout, mounted read-only, belongs to the host user.
        RUN git config --system --add safe.directory '*'
        COPY --from=caddy /usr/bin/caddy /usr/local/bin/caddy
      args:
        # The same version as @playwright/test in package.json: the image's browsers match the library.
        PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
        CADDY_IMAGE: 'caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b'
        PNPM_VERSION: ${PNPM_VERSION:?the version of package.json#packageManager}
    init: true
    cpus: ${CI_LOCAL_CPUS:-4}
    mem_limit: ${CI_LOCAL_MEMORY:-6g}
    memswap_limit: ${CI_LOCAL_MEMORY:-6g}
    # Chrome needs a large /dev/shm.
    shm_size: ${CI_LOCAL_SHM:-2g}
    working_dir: /work
    environment:
      CI: 'true'
      DATABASE_URL: postgres://app:app-ci@db:5432/app
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_HTTP_PORT: '8025'
      EDGE_RUNTIME: binary
    volumes:
      - work:/work
      - pnpm-store:/pnpm-store
      - ${CI_LOCAL_RESULTS:?}:/results
      # The host checkout and its git directory, at their own paths (a linked worktree points into the main one).
      - ${CI_LOCAL_TOP:?}:${CI_LOCAL_TOP}:ro
      - ${CI_LOCAL_GIT:?}:${CI_LOCAL_GIT}:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Runs the command it is given, then leaves the container's peak memory (its own cgroup, page cache
    # included) and the reports in /results/$STEP/ for the script's summary, owned by the host user.
    entrypoint:
      - sh
      - -c
      - |
        "$$@"; status=$$?
        mkdir -p "/results/$$STEP"
        cat /sys/fs/cgroup/memory.peak > "/results/$$STEP/memory.peak"
        for report in test-results playwright-report lighthouse-report; do
          if [ -e "$$report" ]; then cp -r "$$report" "/results/$$STEP/"; fi
        done
        chown -R "$${HOST_UID:-0}" /results
        exit $$status
      - sh

volumes:
  work:
  # Kept between runs, like CI's pnpm cache (`docker volume rm <prefix>-pnpm-store` to reclaim).
  pnpm-store:
    external: true
    name: ${CI_DOCKER_PREFIX:?}-pnpm-store
