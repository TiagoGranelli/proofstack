name: Release

# A `vX.Y.Z` tag publishes a GitHub Release whose notes are that version's section of CHANGELOG.md. The tag is
# the release; nothing is built or uploaded. workflow_dispatch republishes an existing tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true

permissions: {}

jobs:
  release:
    name: GitHub Release from CHANGELOG.md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Check the version and extract its notes
        run: |
          version="${TAG#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$package" != "$version" ]; then
            echo "::error::package.json has version $package; expected $version for tag $TAG" >&2
            exit 1
          fi
          # The lines after "## [x.y.z]" up to the next "## [" heading (Keep a Changelog).
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || {
            echo "::error::CHANGELOG.md has no '## [$version]' section; expected one for tag $TAG" >&2
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
