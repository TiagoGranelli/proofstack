# gitleaks configuration (`pnpm ci:secrets`, and the pre-commit hook when a local gitleaks binary exists; both pass
# it with --config, and .config/gitleaksignore with --gitleaks-ignore-path): gitleaks' default rules plus one for
# passwords in URLs, which the defaults miss.
# Values that are safe to commit follow a convention the allowlist knows: placeholders that say so
# (`...-placeholder-...`, `...-not-a-secret...`) and the documentation example `user:password`. Name a new test value
# the same way instead of adding an allowlist entry. The secret scan reads the whole history, which this branch shares
# with `main`, so the allowlist also keeps the fixed passwords of main's throwaway databases (app-local, app-ci,
# app-smoke).
title = "gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "url-credentials"
description = "Password embedded in a URL (postgres://user:password@host, smtps://user:password@host)"
regex = '''\b[a-z][a-z0-9+.-]*://[^\s:/@"'`]+:([^\s:/@"'`$]+)@[^\s"'`]+'''
secretGroup = 1
keywords = ["://"]

[[allowlists]]
description = "Values that are safe to commit by convention (see the top of this file)"
targetRules = ["url-credentials"]
regexTarget = "secret"
regexes = [
  # Fixed passwords of main's throwaway local, CI and smoke-test databases, in the shared history.
  '''^[a-z]+-(local|ci|smoke)$''',
  # Build-time and test placeholders that nothing connects with.
  '''placeholder''',
  '''not-a-secret''',
  # Dummies and documentation examples: postgres://build:build@127.0.0.1:1/build, smtps://user:password@...
  '''^(build|unused|password)$''',
]

[[allowlists]]
description = "Test fixtures: files under tests/fixtures/ hold fake credentials only"
paths = ['''^tests/fixtures/''']
