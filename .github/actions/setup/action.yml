name: Setup
description: pnpm (version from package.json#packageManager), Node (package.json#devEngines.runtime), cached store, frozen install, Playwright browsers.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`. Jobs whose script needs only Node and Docker skip it.
    default: 'true'
  browsers:
    description: Space-separated Playwright browsers to install (cached), with their system dependencies, e.g. `chromium firefox webkit`.
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - id: playwright
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # The cache key names the Playwright version and the browser set, so adding a browser misses the cache.
      run: |
        echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        echo "browsers=$(tr -s ' ' '\n' <<< "$BROWSERS" | sort | paste -sd- -)" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: inputs.browsers != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browsers <<< "$BROWSERS"
        pnpm exec playwright install --with-deps "${browsers[@]}"
    # Cache hit: the browsers are restored, but their system libraries live outside the cache. The
    # ubuntu-24.04 image ships Google Chrome, whose packages cover what Chromium links against; Firefox and
    # WebKit need more. apt (30 s or more) runs only if a restored binary or library actually misses one.
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        missing=$(find ~/.cache/ms-playwright -type f \( -perm -u+x -o -name '*.so*' \) -exec ldd {} + 2>/dev/null | grep 'not found' | sort -u || true)
        if [ -n "$missing" ]; then
          echo "$missing"
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install-deps "${browsers[@]}"
        fi
