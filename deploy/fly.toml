# Fly.io, built from the repository's Dockerfile. docs/operations.md, "Fly.io", has the procedure. Copy this
# file to the repository root as fly.toml, rename the app, then `fly launch --no-deploy` and `fly deploy`.
# Secrets are not here: `fly secrets set DATABASE_URL=... BETTER_AUTH_SECRET=...` (see the docs).
app = "proofstack-example"
primary_region = "ams"
# SIGTERM starts the drain; the grace period covers SERVER_SHUTDOWN_TIMEOUT (5 s) and the shutdown steps.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
dockerfile = "Dockerfile"

[deploy]
# Runs once per deploy in a temporary machine with the app's secrets, before any new machine starts. A
# non-zero exit stops the deploy. Concurrent runs are safe (docs/operations.md, "Build and deploy").
release_command = "node .output/migrate.mjs"
strategy = "rolling"

[env]
APP_URL = "https://proofstack-example.fly.dev"
AUTH_SIGN_UP = "closed"
# Fly's proxy appends the client address to X-Forwarded-For and connects from Fly's private network.
# Check the ranges against Fly's documentation for your organization before relying on per-IP rate limits.
TRUSTED_PROXIES = "172.16.0.0/12,fdaa::/16"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
min_machines_running = 2

[[http_service.checks]]
grace_period = "15s"
interval = "10s"
method = "GET"
path = "/api/ready"
timeout = "3s"

[[vm]]
memory = "512mb"
cpus = 1
