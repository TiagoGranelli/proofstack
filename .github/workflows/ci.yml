name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the running check. Runs on main always finish, so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # Matches the postgres service below. Test databases (*_test) are created next to it by the scripts.
  DATABASE_URL: postgres://proofstack:proofstack-ci@localhost:5432/proofstack

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # The component tests run in Chromium (Vitest browser mode).
          playwright: 'true'
      # The same gates as `pnpm check`, as separate steps so every failure is reported. Its drift gate runs
      # in the drift job below.
      - run: pnpm format:check
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm deadcode
      - if: ${{ !cancelled() }}
        run: pnpm test:fast
      - if: ${{ !cancelled() }}
        run: node scripts/check.ts --only=guards

  drift:
    name: Contract and database drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:18.6
        env:
          POSTGRES_USER: proofstack
          POSTGRES_PASSWORD: proofstack-ci
          POSTGRES_DB: proofstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofstack -d proofstack"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # openapi.json + SDK, drizzle-kit generate/check, Better Auth schema, migrations vs schema on a fresh DB.
      - run: pnpm check:drift

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          # Placeholders for the build-time prerender (it fails the build if /about cannot be rendered);
          # the real values are provided at runtime.
          APP_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify app (SDK integration + E2E)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - run: pnpm verify:app
        env:
          # The artifact is this commit's build; its file times say nothing about the checkout's.
          ALLOW_STALE_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-app-report
          # test-results/app-server.log (server output), test-results/playwright (traces), playwright-report.
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      # Median of 5 runs per page and form factor; policy and budgets live in scripts/lighthouse.ts.
      - run: pnpm lighthouse --runs=5
        env:
          ALLOW_STALE_BUILD: '1'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Includes app-server.log.
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14

  docker:
    name: Docker image (build, migrate, serve)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres: *postgres
    env:
      IMAGE: proofstack:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The production path end to end: the image's own build (prerender included), the bundled migrator
      # against a real Postgres, readiness, and a graceful stop. --network host reaches the service on localhost.
      - name: Build the image
        run: docker build --tag "$IMAGE" .
      - name: Migrate twice (the second run must apply nothing)
        run: |
          for run in 1 2; do
            docker run --rm --network host -e DATABASE_URL "$IMAGE" node .output/migrate.mjs | tee "migrate-$run.log"
          done
          grep -q '"applied":0' migrate-2.log
      - name: Start and wait for /api/ready
        run: |
          docker run --detach --name app --network host -e DATABASE_URL \
            -e APP_URL=http://localhost:3000 -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" "$IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/ready && break
            [ "$(docker inspect --format '{{.State.Running}}' app)" = true ] || exit 1
            sleep 1
          done
          curl -fsS http://localhost:3000/api/ready
          curl -fsS --output /dev/null http://localhost:3000/
          curl -fsS --output /dev/null http://localhost:3000/about
      - name: Stop gracefully
        run: |
          started=$(date +%s%N)
          docker stop app
          ms=$(( ($(date +%s%N) - started) / 1000000 ))
          code=$(docker inspect --format '{{.State.ExitCode}}' app)
          echo "docker stop took ${ms} ms, exit code ${code}"
          [ "$code" = 0 ] && [ "$ms" -lt 5000 ]
      - if: ${{ !cancelled() }}
        run: docker logs app || true
