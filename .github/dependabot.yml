version: 2
# Not covered here:
# - Container images. scripts/images.ts is their single source; compose.yaml, ci.yml and the Dockerfile hold
#   copies that `pnpm ci:workflows` checks. The docker and docker-compose ecosystems would update only the
#   Dockerfile and compose.yaml copies, never scripts/images.ts or ci.yml, so every such PR would fail that
#   check. `pnpm images:check` reports newer tags and rebuilt digests instead, `pnpm images:sync` rewrites the
#   copies after a pin moves, and the grype scan in `pnpm ci:docker` fails when a base image has a fixable
#   high or critical vulnerability.
# - Security alerts. GitHub's dependency graph parses pnpm 12 lockfiles as empty (dependabot-core#15904), so
#   Dependabot never raises an alert or a security update for npm packages. `pnpm audit:check` in CI's
#   supply-chain job is the vulnerability gate.
updates:
  # Workflow and composite-action pins (full commit SHAs with a version comment, which Dependabot keeps).
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    # Same quarantine as npm below: a compromised release is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # package.json pins exact versions; `increase` rewrites the pin to the new exact version.
    versioning-strategy: increase
    # pnpm quarantines fresh releases (minimumReleaseAge); proposing only week-old versions keeps
    # `pnpm install --frozen-lockfile` from rejecting the update.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      # Minor and patch updates in one weekly PR. Majors and the pre-release packages below get their
      # own PRs (AGENTS.md "Version policy": each needs check, check:drift and verify:app on its own).
      npm-minor-and-patch:
        update-types: [minor, patch]
        patterns: ['*']
        exclude-patterns: [effect, '@tanstack/react-start', nitro, oxfmt]
    ignore:
      # Pinned to the `next` snapshot (ADR 0002). The stable 0.99.0 sorts higher but crashes on TS 7;
      # `pnpm deps:check` reports when a newer stable release appears.
      - dependency-name: '@hey-api/openapi-ts'
      # Tracks the Node major in .node-version.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
