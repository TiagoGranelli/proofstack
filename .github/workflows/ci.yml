name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the running check. Runs on main always finish, so every
# commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job only provides tooling and services and runs one `pnpm ci:<job>` script (scripts/ci-jobs.ts), so
# `pnpm ci:local <job>` reproduces it on a laptop. Job logic belongs in the scripts, not here.
env:
  CI: true
  # Matches the postgres service below. Test databases (*_test) are created next to it by the scripts.
  DATABASE_URL: postgres://proofstack:proofstack-ci@localhost:5432/proofstack

jobs:
  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm ci:workflows

  static:
    name: Static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit is the baseline of the `security` gate and the applied-migrations guard.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          # The component tests in `pnpm check` run in Chromium (Vitest browser mode).
          browsers: chromium
      - run: pnpm ci:static

  # The same static gates on Windows, so a script that only works on Linux and macOS (a `.cmd` shim started
  # without a shell, a path joined with `/`) shows up. Not a gate yet: it has not had a green run, and Windows
  # minutes cost more, so it runs on main and on demand, not on every pull request.
  static-windows:
    name: Static gates on Windows (not blocking)
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: pnpm ci:static

  supply-chain:
    name: Supply chain (release age, trust, signatures, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The frozen install verifies every lockfile entry against minimumReleaseAge and trustPolicy.
      - uses: ./.github/actions/setup
      - run: pnpm ci:supply-chain

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tree: a secret removed later is still in the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm ci:secrets

  drift:
    name: Contract and database drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: proofstack
          POSTGRES_PASSWORD: proofstack-ci
          POSTGRES_DB: proofstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofstack -d proofstack"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:drift

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  verify:
    name: Verify app (SDK integration + E2E, 5 browser projects)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres: *postgres
      # verify:app sends account emails here; the E2E tests read the links back (default ports of verify:app).
      mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 54325:1025
          - 54380:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium firefox webkit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - run: pnpm ci:verify
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-app-report
          # test-results/app-server.log (server output), test-results/playwright (traces), playwright-report.
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse (through the Caddy edge)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - run: pnpm ci:lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Includes app-server.log and edge.log.
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14

  docker:
    name: Docker image (build, migrate, serve behind the edge)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm ci:docker
