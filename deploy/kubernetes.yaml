# Kubernetes: the app as a Deployment behind a Service, with the migrations in an init container.
# docs/operations.md, "Kubernetes", has the procedure. Replace the image and APP_URL; create the Secret first:
#   kubectl create secret generic app --from-literal=DATABASE_URL=... --from-literal=BETTER_AUTH_SECRET=...
# Validated with kubeconform (`pnpm ci:workflows`). Needs Kubernetes 1.30 or later (the preStop sleep action).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app.kubernetes.io/name: app }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: app }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app }
    spec:
      # preStop (5 s) + the drain (SERVER_SHUTDOWN_TIMEOUT, 5 s) + the shutdown steps (mail sends up to 20 s).
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Every new pod runs the migrator first. Several at once are safe: they queue on an advisory lock, and
        # the later ones find nothing to apply. With a pooler, point MIGRATION_DATABASE_URL at a direct URL.
        - name: migrate
          image: registry.example.com/app:2026-09-27
          command: [node, .output/migrate.mjs]
          envFrom: [{ secretRef: { name: app } }]
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      containers:
        - name: app
          image: registry.example.com/app:2026-09-27
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: app } }]
          env:
            - { name: APP_URL, value: https://app.example.com }
            # The ingress controller's pods: replace with your cluster's pod CIDR, or the controller's addresses.
            - { name: TRUSTED_PROXIES, value: 10.244.0.0/16 }
            - { name: DATABASE_POOL_MAX, value: '10' }
          securityContext: *container-security
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never checks the database: an outage would restart every pod without fixing anything.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # 503 while Postgres is unreachable, and from SIGTERM on.
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Endpoints drop a terminating pod asynchronously; keep serving until the load balancers notice,
            # and only then let SIGTERM start the drain.
            preStop:
              sleep: { seconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels: { app.kubernetes.io/name: app }
spec:
  selector: { app.kubernetes.io/name: app }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: app }
