name: CI

on:
  push:
    branches: [main, minimal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the running check. Runs on a branch always finish, so every commit there
# gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job only provides tooling and runs one `pnpm ci:<job>` script (scripts/ci-jobs.ts), so `pnpm ci:local <job>`
# reproduces it locally. Job logic belongs in the scripts, not here.
env:
  CI: true

jobs:
  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm ci:workflows

  static:
    name: Static gates (pnpm check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit is the baseline of the `security` job (CHECK_BASE_REF).
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          # The component tests in `pnpm check` run in Chromium (Vitest browser mode).
          browsers: chromium
      - run: pnpm ci:static

  supply-chain:
    name: Supply chain (release age, trust, signatures, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The frozen install verifies every lockfile entry against minimumReleaseAge and trustPolicy.
      - uses: ./.github/actions/setup
      - run: pnpm ci:supply-chain

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tree: a secret removed later is still in the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm ci:secrets

  e2e:
    name: End-to-end and accessibility (production build, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: pnpm ci:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          # test-results/playwright (traces), playwright-report.
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse (production build over HTTPS and HTTP/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: pnpm ci:lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
