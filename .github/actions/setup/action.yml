name: Setup
description: pnpm (version from package.json#packageManager), Node (.node-version), cached store, frozen install.
inputs:
  playwright:
    description: Also install Playwright's Chromium (cached) and, when needed, its system dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - id: playwright
      if: inputs.playwright == 'true'
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    # Cache hit: the browsers are restored, but their system libraries live outside the cache. The
    # ubuntu-24.04 image ships Google Chrome, whose packages cover what Chromium links against, so apt
    # (about 30 s) runs only if a library is actually missing.
    - if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} + | grep 'not found' || true)
        if [ -n "$missing" ]; then
          echo "$missing"
          pnpm exec playwright install-deps chromium
        fi
