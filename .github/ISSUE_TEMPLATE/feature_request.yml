name: Feature or change
description: Propose a gate to add, change or drop, or something this branch should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This branch carries the gates and a small demo, nothing more. A proposal is most likely to land when it helps
        most projects that copy the gates and keeps them as strict as they are.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the gates get in the way or fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change, and which files or gates it touches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else you considered, including doing it in your own project instead.
