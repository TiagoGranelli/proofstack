# pnpm 12 reads project settings from this file even without workspace packages. pnpm fails on a key it does
# not know (ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS), so a typo cannot silently drop a policy.
# Dependency lifecycle scripts are blocked by default; every exception must be listed here.
allowBuilds:
  # lefthook's postinstall runs `lefthook install`, which the `prepare` script already does.
  lefthook: false
engineStrict: true
# Scripts run in pnpm's own shell on every platform, so `${VAR:-default}` and globs in package.json behave the
# same on Windows (cmd.exe expands neither) as on Linux and macOS.
shellEmulator: true
# `pnpm add` writes exact versions (package.json pins every dependency; tests/unit/repo-policy.test.ts checks).
savePrefix: ''

# Release quarantine: no version younger than one day is resolved. Set explicitly, which makes it strict: a
# release inside the window fails the install (or prompts) instead of being appended silently to
# minimumReleaseAgeExclude, as pnpm's implicit default does. Renovate waits 7 days before proposing a direct
# dependency (.github/renovate.json); this day is the floor for everything else: transitive versions, updates by
# hand and Renovate's security PRs, which skip its wait. `pnpm install --frozen-lockfile` checks every lockfile entry
# against this and trustPolicy (about 5 s; needs the registry).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# `pnpm install`, `add`, `update` and `remove` drop exclude entries the lockfile no longer resolves.
minimumReleaseAgeExcludePrune: true
# Exceptions name one exact version and say why, for example a security fix needed before it is a day old:
#   - 'some-package@1.2.3' # GHSA-xxxx-xxxx-xxxx fix; remove once older than a day (2026-10-01)
minimumReleaseAgeExclude: []

# Fails a version published with weaker provenance than an earlier one of the same package (a trusted
# publisher replaced by a token, the usual sign of a takeover). Versions older than 30 days are not checked:
# semver@6.3.1 and why-is-node-running@3.2.2, both years old, fail it only because later majors adopted trusted
# publishing, and a takeover shows up as a new version, which is always checked.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Advisories `pnpm audit:check` (`pnpm audit --audit-level high`, CI `supply-chain`) accepts. Only one that cannot
# apply here goes in, with the reason and a review date; the usual fix is an upgrade or an `overrides` entry that
# names the advisory.
auditConfig:
  ignoreGhsas: []

# An unmet peer fails the install instead of printing a warning nobody reads. pnpm otherwise fills a missing
# optional peer from any version in the graph, which can load two copies of one library.
strictPeerDependencies: true

# TypeScript is 7.0.2 (ADR 0002). The TanStack Router lint plugin, which oxlint loads as a JS plugin, brings
# typescript-eslint 8, whose packages declare typescript <6.1. Oxlint hands JS plugins empty parser services, so
# the rules' optional type-aware paths are skipped and TypeScript's compiler API, which TS 7 no longer has, is
# never called. Remove these once typescript-eslint supports TS 7 (typescript-eslint/typescript-eslint#10940).
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/project-service>typescript': 7.0.2
    '@typescript-eslint/tsconfig-utils>typescript': 7.0.2
    '@typescript-eslint/typescript-estree>typescript': 7.0.2
    '@typescript-eslint/utils>typescript': 7.0.2
