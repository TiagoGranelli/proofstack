# Local development services. Compose reads COMPOSE_PROJECT_NAME and the ports and passwords below from .env
# (see .env.example); the URLs in .env must match them.
# db: `pnpm db:up` / `pnpm db:down`. DATABASE_URL must match POSTGRES_PORT and POSTGRES_PASSWORD, which only
# takes effect when the volume is first created.
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: proofstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofstack-local}
      POSTGRES_DB: proofstack
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-54329}:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U proofstack -d proofstack]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends (`pnpm mail:up`): SMTP_URL=smtp://127.0.0.1:${MAILPIT_SMTP_PORT}, inbox and
  # REST API (the E2E tests read links from it) at http://127.0.0.1:${MAILPIT_HTTP_PORT}. Nothing leaves the host.
  # Pinned by digest; the image's own healthcheck (`mailpit readyz`) lets `--wait` return when it is ready.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-54325}:1025
      - 127.0.0.1:${MAILPIT_HTTP_PORT:-54380}:8025

volumes:
  db-data:
